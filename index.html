<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <!-- Forza IE a usare il motore di rendering più recente (Edge HTML) -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SITO IE 11</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f4f4f9;
            color: #333;
        }
        .container {
            max-width: 600px;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        button {
            padding: 10px 15px;
            background-color: #0078d4; /* Blu stile Microsoft */
            color: white;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #005a9e;
        }
        #output {
            margin-top: 20px;
            font-weight: bold;
            color: #0078d4;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>sito</h1>
        <p>Questa pagina è fatta per funzionare senza problemi sia sui browser moderni sia su <strong>Internet Explorer 11</strong>.</p>
        
        <!-- Bottone che attiverà la funzione JS -->
        <button id="mioBottone">Cliccami</button>
        
        <!-- Area dove mostreremo il testo dinamico -->
        <div id="output"></div>
    </div>

    <!-- JavaScript Integrato compatibile ES5 (IE11) -->
    <script type="text/javascript">
        // Usiamo 'var' al posto di 'let' o 'const'
        var bottone = document.getElementById('mioBottone');
        var outputDiv = document.getElementById('output');

        // Funzione tradizionale invece della arrow function () => {}
        bottone.addEventListener('click', function() {
            // Concatenazione classica di stringhe (+), niente template literals (``)
            var dataCorrente = new Date().toLocaleTimeString();
            outputDiv.innerHTML = 'Hai cliccato sul bottone alle ore: ' + dataCorrente;
        });
    </script>

</body>
</html>
